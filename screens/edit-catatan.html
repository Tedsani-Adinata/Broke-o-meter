      body {

<body class="flex justify-center min-h-screen">
  <div class="relative w-full max-w-[430px] min-h-screen bg-surface font-body-md text-on-surface shadow-2xl flex flex-col overflow-x-hidden">
    
    <header class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] z-30 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
      <div class="h-16 px-margin flex items-center justify-between gap-space-sm">
        <div class="flex items-center gap-space-sm min-w-0">
          <img alt="Broke-o-meter Logo" class="h-8 w-auto object-contain flex-shrink-0" src="https://lh3.googleusercontent.com/aida/AEtjO1W7UoyRM9C5k7Q-BYP6TZxptxkixhfMH-QU8CVQfqRE-WwOCEvouR6fOFjOPTRuk7pjh3MvyY2dMIP4mjovt7cTWx0G1ArxoJhaBS7EWY0ZegpAqDTTwaaNoRl4T72PIli8ApYhQJEOct7KJEDreoXh0SYi0SWCmW3qq3RuITGkGFRySF3IunX8ya-iJHR9bZuJnBdIU5uNTi82jvd1IGh2XpmOxKLspFuq99dxp2uUO-DSNQTECeVFAQ"/>
          <div class="flex flex-col min-w-0">
            <span class="font-headline-md text-headline-md tracking-tight text-on-surface truncate">Broke-o-meter</span>
            <span class="font-label-sm text-label-sm text-on-surface-variant truncate">Hari Ini</span>
          </div>
        </div>
        <div class="flex items-center gap-space-xs flex-shrink-0">
          <a aria-label="Pengaturan" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container active:scale-95 text-on-surface-variant transition-all" href="pengaturan.html">
            <span class="material-symbols-outlined text-[24px]">settings</span>
          </a>
          <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center">
            <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
          </div>
        </div>
      </div>
    </header>

    <main class="flex flex-col relative w-full pt-16 pb-28 bg-surface min-h-screen">
      <div class="flex flex-col w-full relative">
        <div class="px-margin flex flex-col gap-space-lg select-none pointer-events-none opacity-40">
          <div class="bg-surface-container-lowest rounded-lg p-space-lg shadow-sm flex flex-col gap-space-md">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-space-sm">
                <span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">speed</span>
                <span class="font-headline-sm text-headline-sm text-on-surface">Status Dompet</span>
              </div>
              <span class="bg-tertiary-fixed text-on-tertiary-fixed px-space-md py-space-xs rounded-full font-label-sm text-label-sm">
                ⚡ Mulai Goyah
              </span>
            </div>
            <div class="flex flex-col gap-space-xs">
              <div class="flex justify-between items-baseline">
                <span class="font-body-sm text-body-sm text-on-surface-variant">Sisa Budget Harian</span>
                <span class="font-headline-lg text-headline-lg text-primary">Rp 42.500</span>
              </div>
              <div class="w-full h-4 bg-surface-container-high rounded-full overflow-hidden p-0.5">
                <div class="h-full bg-primary-container rounded-full w-[68%]"></div>
              </div>
              <div class="flex justify-between font-label-sm text-label-sm text-on-surface-variant">
                <span>Terpakai: Rp 157.500</span>
                <span>Batas: Rp 200.000</span>
              </div>
            </div>
          </div>
        </div>

        <div class="fixed inset-0 z-40 bg-inverse-surface/50 backdrop-blur-sm transition-opacity duration-300" id="modalBackdrop"></div>

        <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] z-50 flex flex-col bg-surface-container-lowest rounded-t-lg shadow-xl transition-transform duration-300 transform translate-y-0 pb-safe" id="bottomSheet">
          <div class="pt-3 pb-1 flex justify-center items-center cursor-grab active:cursor-grabbing">
            <div class="w-12 h-1.5 bg-surface-container-highest rounded-full"></div>
          </div>
          <div class="px-margin py-space-sm flex items-center justify-between">
            <div class="flex flex-col">
              <h2 class="font-headline-md text-headline-md text-on-surface tracking-tight">Edit Pengeluaran</h2>
              <span class="font-body-sm text-body-sm text-on-surface-variant">Koreksi dompet sebelum overthinking</span>
            </div>
            <a aria-label="Tutup sheet" class="w-11 h-11 rounded-full flex items-center justify-center bg-surface-container hover:bg-surface-container-high active:scale-95 text-on-surface transition-all" href="hari-ini.html">
              <span class="material-symbols-outlined text-[22px]">close</span>
            </a>
          </div>
          <form class="px-margin pt-space-xs pb-space-md flex flex-col gap-space-md" id="editForm" onsubmit="event.preventDefault(); window.location.href='hari-ini.html';">
            <div class="flex flex-col gap-1.5">
              <label class="font-label-md text-label-md text-on-surface-variant" for="itemName">Nama Barang / Pengeluaran</label>
              <div class="flex items-center px-space-md h-13 bg-surface-container-low rounded-DEFAULT focus-within:bg-surface-container transition-all">
                <span class="material-symbols-outlined text-on-surface-variant text-[20px] mr-2">shopping_bag</span>
                <input class="w-full bg-transparent border-0 outline-none font-body-lg text-body-lg text-on-surface placeholder:text-outline" id="itemName" type="text" value="Ayam goreng"/>
              </div>
            </div>
            <div class="flex flex-col gap-1.5">
              <label class="font-label-md text-label-md text-on-surface-variant" for="itemAmount">Total Nominal</label>
              <div class="flex items-center justify-between px-space-md h-14 bg-surface-container-low rounded-DEFAULT focus-within:bg-surface-container transition-all">
                <span class="font-headline-md text-headline-md text-primary mr-1">Rp</span>
                <input class="w-full bg-transparent border-0 outline-none font-headline-xl-mobile text-headline-xl-mobile text-on-surface text-right" id="itemAmount" inputmode="numeric" type="text" value="10.000"/>
              </div>
            </div>
            <div class="flex flex-col gap-2">
              <label class="font-label-md text-label-md text-on-surface-variant">Kategori Pengeluaran</label>
              <div class="flex items-center gap-space-xs overflow-x-auto no-scrollbar py-1">
                <button class="category-chip h-10 px-space-md rounded-full font-label-lg text-label-lg flex items-center gap-1.5 transition-all bg-primary-container text-on-primary shadow-sm active:scale-95 flex-shrink-0" type="button">
                  <span>🍜</span><span>Makan</span>
                </button>
                <button class="category-chip h-10 px-space-md rounded-full font-label-lg text-label-lg flex items-center gap-1.5 transition-all bg-surface-container text-on-surface-variant hover:bg-surface-container-high active:scale-95 flex-shrink-0" type="button">
                  <span>🧋</span><span>Minum</span>
                </button>
                <button class="category-chip h-10 px-space-md rounded-full font-label-lg text-label-lg flex items-center gap-1.5 transition-all bg-surface-container text-on-surface-variant hover:bg-surface-container-high active:scale-95 flex-shrink-0" type="button">
                  <span>🛵</span><span>Transport</span>
                </button>
                <button class="category-chip h-10 px-space-md rounded-full font-label-lg text-label-lg flex items-center gap-1.5 transition-all bg-surface-container text-on-surface-variant hover:bg-surface-container-high active:scale-95 flex-shrink-0" type="button">
                  <span>✨</span><span>Lainnya</span>
                </button>
              </div>
            </div>
            <div class="flex items-center justify-between px-space-md py-space-sm bg-surface-container rounded-DEFAULT">
              <div class="flex items-center gap-space-xs text-on-surface-variant">
                <span class="material-symbols-outlined text-[18px]">schedule</span>
                <span class="font-label-sm text-label-sm uppercase tracking-wider">Waktu Transaksi</span>
              </div>
              <span class="font-label-md text-label-md text-on-surface">12 Okt 2026, 12:45 WIB</span>
            </div>
            <div class="flex flex-col gap-space-xs pt-space-xs">
              <button class="w-full h-13 min-h-[52px] bg-primary-container text-on-primary rounded-full font-label-lg text-label-lg shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-space-sm" onclick="window.location.href='hari-ini.html'" type="button">

                <span>Simpan Perubahan</span>
              </button>
              <button class="w-full h-12 min-h-[48px] bg-error-container text-on-error-container rounded-full font-label-lg text-label-lg active:scale-[0.98] transition-all flex items-center justify-center gap-space-sm" onclick="window.location.href='hari-ini.html'" type="button">
                <span class="material-symbols-outlined text-[20px]">delete</span>
                <span>Hapus Catatan</span>
              </button>
            </div>
